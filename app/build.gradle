plugins { id 'com.android.application' }
android {
    namespace 'com.spherical.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.spherical.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable APK without your own keystore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
