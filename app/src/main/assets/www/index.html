<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spherical</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#dedccf;color:#1f1f1b;font:9px/1.2 ui-monospace,Menlo,"Roboto Mono","Droid Sans Mono",monospace;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;padding:6px max(18px,env(safe-area-inset-right)) 8px max(44px,env(safe-area-inset-left))}
header{display:flex;align-items:center;height:30px;flex:none}
#logo{flex:1;font-size:8px;letter-spacing:.18em}
#pat{display:flex;gap:14px;align-items:center;font-size:8px;letter-spacing:.2em}
#pat button{font-size:13px;padding:4px 8px}
#pn{min-width:58px;text-align:center}
#mw{flex:1;text-align:right}#menu{font-size:14px;padding:4px 8px}
#pop{position:absolute;right:16px;top:32px;background:#dedccf;border:1px solid #1f1f1b;display:flex;flex-direction:column;z-index:5}
#pop button{padding:9px 18px;text-align:left;font-size:8px}
#tracks{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
#tracks::-webkit-scrollbar{display:none}
.row{height:33.333%;display:flex}
.lb{width:76px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:8px;letter-spacing:.14em;padding-right:8px;transition:opacity .2s}
.lb b{font-weight:700}.lb i{font-style:normal;color:#8a887b;font-size:7px;letter-spacing:.06em}
.lb svg{width:9px;height:9px;stroke-width:1}
canvas.tk{flex:1;min-width:0;height:100%;touch-action:none}
footer{height:52px;flex:none;display:flex;align-items:center;gap:16px}
#bw{display:flex;align-items:baseline;gap:3px;touch-action:none;min-width:70px}
#bpm{font-size:25px;font-weight:800;letter-spacing:-.05em}
small{font-size:7px;letter-spacing:.1em;color:#8a887b}
#tap{font-size:8px;padding:10px 6px}
#mid{flex:1;display:flex;justify-content:center;gap:10px}
#mid button{padding:10px}#mid svg{width:12px;height:12px;stroke-width:1}
#play{width:42px;height:42px;border-radius:50%;background:#111;display:grid;place-items:center;padding:0}
#play::after{content:'';border-left:12px solid #dedccf;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:4px}
#play.on::after{width:11px;height:11px;border:0;background:#dedccf;margin:0}
#viz{position:fixed;inset:0;background:#dedccf;z-index:9}
#cv{width:100%;height:100%;display:block;touch-action:none}
#x{position:absolute;top:8px;right:max(16px,env(safe-area-inset-right));font-size:18px;padding:8px 10px}
#sn{position:absolute;bottom:12px;left:0;right:0;text-align:center;letter-spacing:.22em;font-size:7px;pointer-events:none}
</style></head><body>
<div id="app">
<header><span id="logo">spherical</span>
<div id="pat"><button id="pl">&lsaquo;</button><span id="pn">FOUR</span><button id="pr">&rsaquo;</button></div>
<div id="mw"><button id="menu">&#8942;</button></div></header>
<div id="pop" hidden><button id="clr">CLEAR</button><button id="vz2">VISUAL</button></div>
<main id="tracks"></main>
<footer>
<div id="bw"><span id="bpm">120</span><small>BPM</small></div>
<button id="tap">TAP</button>
<div id="mid">
<button id="vis" aria-label="visual"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="1.5" y="1.5" width="9" height="9"/><circle cx="6" cy="6" r="1" fill="currentColor"/></svg></button>
<button id="rnd" aria-label="random"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.2V6l2 1.4"/></svg></button>
</div>
<button id="play" aria-label="play"></button>
</footer></div>
<div id="viz" hidden><canvas id="cv"></canvas><button id="x">&times;</button><div id="sn">ROOM</div></div>
<script>
const $=s=>document.querySelector(s),INK='#1f1f1b',BG='#dedccf',cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const WV=['sine','triangle','sawtooth','square'],TUNES=[1,1.25,.8,1.5];
const IC=['<circle cx="5" cy="5" r="3.5"/>','<path d="M5 1.5l4 7H1z"/>','<rect x="1.5" y="1.5" width="7" height="7"/>','<path d="M1 3.5h8M1 6.5h8"/>','<path d="M1 5C3 1 7 9 9 5"/>','<path d="M1 8l3-6 2 4 3-4"/>','<path d="M2 2l6 6M8 2l-6 6"/>'];
const TR=[
{n:'KICK',sig:.016,hz:50,dr:1},{n:'CLAP',sig:.02,hz:1300,dr:1},{n:'PERC',sig:.012,hz:520,dr:1},{n:'HAT',sig:.01,hz:7000,dr:1},
{n:'SUB',sig:.05,hz:55,wv:0},{n:'SYN',sig:.02,hz:220,wv:2},{n:'CHORD',sig:.04,hz:220,wv:1}];
const PR=[
['FOUR',[[0,.25,.5,.75],[.5],[],[.125,.375,.625,.875],[0],[],[0]]],
['BROKEN',[[0,.1875,.5,.6875],[.375,.875],[.3125,.8125],[.125,.25,.625,.75,.9375],[0,.5],[.1875,.4375,.6875],[0,.5]]],
['HALF',[[0,.5],[.5],[.75],[.25,.5,.75],[0],[],[0]]],
['DUB',[[0,.375,.5],[.5],[.625],[.0625,.3125,.5625,.8125],[0,.375],[.25,.75],[0,.5]]],
['ROLL',[[0,.25,.5,.75],[.25,.75],[.125,.625,.875],[.0625,.125,.1875,.3125,.4375,.5625,.6875,.8125,.9375],[0,.25,.5,.75],[.125,.375,.5,.875],[0]]]];
let S={bpm:120},pat=0,playing=false,t0=0,cur=0,dg=null;
TR.forEach(t=>{t.nodes=[];t.ti=0;t.mute=false;if(t.wv===undefined)t.wv=0});
function setPat(i){pat=(i+PR.length)%PR.length;$('#pn').textContent=PR[pat][0];
 TR.forEach((t,k)=>t.nodes=PR[pat][1][k].map((x,j)=>({x,v:k==0?.9:k==3?(j%2?.8:.5):.7})));save()}
function save(){try{localStorage.sph=JSON.stringify({b:S.bpm,p:pat,t:TR.map(t=>({n:t.nodes.map(n=>({x:n.x,v:n.v})),m:t.mute,w:t.wv,i:t.ti}))})}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.sph);S.bpm=j.b;pat=j.p;$('#pn').textContent=PR[pat][0];
 j.t.forEach((o,k)=>{const t=TR[k];t.nodes=o.n;t.mute=o.m;t.wv=o.w;t.ti=o.i});return true}catch(e){return false}}
/* ---------- audio ---------- */
let ac,mast,an,dS,rS,dl,nb;
const cn=(...n)=>n.reduce((a,b)=>(a.connect(b),b));
const G=(v=0)=>{const g=ac.createGain();g.gain.value=v;return g};
const F=(ty,f,q=1)=>{const b=ac.createBiquadFilter();b.type=ty;b.frequency.value=f;b.Q.value=q;return b};
const E=(g,t,a,d,pk)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(pk,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
const nz=(t,d)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,Math.random());s.stop(t+d);return s};
const snd=(g,d,r)=>{if(d)cn(g,G(d),dS);if(r)cn(g,G(r),rS)};
const osc=(ty,f,t,d,det=0)=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=f;o.detune.value=det;o.start(t);o.stop(t+d);return o};
function initA(){
 if(ac){ac.resume();return}
 ac=new(window.AudioContext||window.webkitAudioContext)();
 mast=ac.createDynamicsCompressor();mast.threshold.value=-14;mast.ratio.value=4;
 an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.78;
 cn(mast,G(.9),an,ac.destination);
 dS=G(1);dl=ac.createDelay(2);cn(dS,dl,F('lowpass',2600),G(.4),dl);cn(dl,G(.4),mast);
 rS=G(1);const cv=ac.createConvolver(),ir=ac.createBuffer(2,ac.sampleRate*2.2|0,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
 cv.buffer=ir;cn(rS,cv,G(.55),mast);
 nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 setDelay();ac.resume()}
const setDelay=()=>{if(dl)dl.delayTime.value=60/S.bpm*.75};
const mul=T=>TUNES[T.ti];
const V=[
(t,v,x,T)=>{const o=ac.createOscillator(),g=G(0);o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(T.hz*mul(T),t+.1);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.95*v,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+.5);cn(o,g,mast);o.start(t);o.stop(t+.55)},
(t,v,x,T)=>{const g=G(0),p=g.gain;[0,.012,.024].forEach(d=>{p.setValueAtTime(.9*v,t+d);p.exponentialRampToValueAtTime(.08,t+d+.01)});
 p.setValueAtTime(.9*v,t+.036);p.exponentialRampToValueAtTime(.001,t+.25);cn(nz(t,.3),F('bandpass',T.hz*mul(T),1.3),g,mast);snd(g,.2,.25)},
(t,v,x,T)=>{const f=T.hz*mul(T)*[1,1.2,1.5,1.78][(x*16|0)%4],o=osc('triangle',f*1.6,t,.2),g=G(0);o.frequency.exponentialRampToValueAtTime(f,t+.05);E(g,t,.002,.14,.5*v);cn(o,g,mast);snd(g,.45,.15)},
(t,v,x,T)=>{const g=G(0);E(g,t,.001,v>.7?.18:.05,.4*v);cn(nz(t,.3),F('highpass',T.hz*mul(T)),g,mast);snd(g,.18,0)},
(t,v,x,T)=>{const g=G(0);E(g,t,.01,.12+v*.5,.7*v);cn(osc(WV[T.wv],T.hz,t,.9),F('lowpass',160),g,mast)},
(t,v,x,T)=>{const f=T.hz*2**([0,3,5,7,10,12,15][(x*32|0)%7]/12),lp=F('lowpass',2800*v+300,7),g=G(0);
 lp.frequency.setValueAtTime(2800*v+300,t);lp.frequency.exponentialRampToValueAtTime(250,t+.28);E(g,t,.004,.32,.25*v);
 cn(osc(WV[T.wv],f,t,.5,-8),lp);cn(osc(WV[T.wv],f,t,.5,8),lp);cn(lp,g,mast);snd(g,.5,.2)},
(t,v,x,T)=>{const lp=F('lowpass',1100),g=G(0);E(g,t,.1,1.5,.12*v);[1,1.2,1.5,1.78].forEach(r=>cn(osc(WV[T.wv],T.hz*r,t,1.8),lp));cn(lp,g,mast);snd(g,.3,.7)}];
const bar=()=>240/S.bpm;
function sched(){
 if(!playing||!ac)return;const L=bar(),look=ac.currentTime+.15;
 while(cur<look){const end=Math.min(look,cur+.05),a=(cur-t0)/L,b=(end-t0)/L;
  for(let k=Math.floor(a);k<=Math.floor(b);k++)TR.forEach((t,i)=>{if(t.mute)return;t.nodes.forEach(n=>{const nt=k+n.x;if(nt>=a&&nt<b){const at=t0+nt*L;n.hit=at;V[i](at,n.v,n.x,t)}})});
  cur=end}}
setInterval(sched,25);
/* ---------- tracks UI ---------- */
const box=$('#tracks');
const geo=t=>({p:8,L:t.cv.w-16,b:t.cv.h*.74,a:t.cv.h*.6});
TR.forEach((t,k)=>{
 const r=document.createElement('div');r.className='row';
 r.innerHTML=`<div class="lb"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor">${IC[k]}</svg><b>${t.n}</b><i></i></div><canvas class="tk"></canvas>`;
 box.append(r);t.cv=r.querySelector('canvas');t.lb=r.querySelector('.lb');t.si=r.querySelector('i');
 let tm,lp=false;
 t.lb.onpointerdown=()=>{lp=false;tm=setTimeout(()=>{lp=true;t.mute=!t.mute;save()},500)};
 t.lb.onpointerup=()=>{clearTimeout(tm);if(!lp){t.dr?t.ti=(t.ti+1)%4:t.wv=(t.wv+1)%4;save()}};
 t.lb.onpointercancel=()=>clearTimeout(tm);
 const c=t.cv,pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);const q=pos(e),{p,L}=geo(t);let best=null,bd=24;
  t.nodes.forEach(n=>{const d=Math.abs(n.x*L+p-q.x);if(d<bd){bd=d;best=n}});
  dg={t,n:best,x0:q.x,y0:q.y,cy:e.clientY,sy:box.scrollTop,mv:false,m:best?'n':'?'}};
 c.onpointermove=e=>{if(!dg||dg.t!==t)return;const q=pos(e),{p,L,b,a}=geo(t);
  if(dg.m==='?'&&Math.abs(e.clientY-dg.cy)>9)dg.m='s';
  if(dg.m==='s'){box.scrollTop=dg.sy-(e.clientY-dg.cy);dg.mv=true;return}
  if(dg.m==='n'){if(Math.abs(q.x-dg.x0)+Math.abs(q.y-dg.y0)>4)dg.mv=true;dg.n.x=cl((q.x-p)/L,0,.999);dg.n.v=cl((b-q.y)/a,.02,1)}};
 c.onpointerup=e=>{if(!dg||dg.t!==t)return;const q=pos(e),{p,L,b,a}=geo(t),d=dg;dg=null;
  if(d.m==='n'){const now=performance.now();
   if(d.n.v<.07||(!d.mv&&d.n.lt&&now-d.n.lt<320))t.nodes.splice(t.nodes.indexOf(d.n),1);else if(!d.mv)d.n.lt=now}
  else if(d.m==='?'&&!d.mv)t.nodes.push({x:cl((q.x-p)/L,0,.999),v:q.y<b?cl((b-q.y)/a,.3,1):.75});
  save()};
 c.onpointercancel=()=>dg=null});
function rs(){TR.forEach(t=>{const c=t.cv,r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);c.width=r.width*d;c.height=r.height*d;c.w=r.width;c.h=r.height;t.dp=d})}
function drawRow(t){
 const c=t.cv;if(!c.w)return;const x=c.getContext('2d'),{p,L,b,a}=geo(t),W=c.w,H=c.h,al=t.mute?.3:1;
 x.setTransform(t.dp,0,0,t.dp,0,0);x.clearRect(0,0,W,H);x.globalAlpha=al;
 const N=Math.ceil(L/2);x.beginPath();x.moveTo(p,b);
 for(let i=0;i<=N;i++){const u=i/N;let y=0;for(const n of t.nodes){const s=t.sig*(.55+.9*n.v),d=u-n.x;y+=n.v*Math.exp(-d*d/(2*s*s))}x.lineTo(p+u*L,b-Math.min(y,1.1)*a)}
 x.lineTo(p+L,b);const g=x.createLinearGradient(0,b-a,0,b);g.addColorStop(0,'rgba(31,31,27,.38)');g.addColorStop(1,'rgba(31,31,27,.02)');
 x.fillStyle=g;x.fill();x.strokeStyle=INK;x.lineWidth=1;x.stroke();
 x.beginPath();x.moveTo(p,b);x.lineTo(p+L,b);x.globalAlpha=al*.55;x.stroke();x.globalAlpha=al;
 x.fillStyle=INK;
 for(const n of t.nodes){const hh=ac?Math.max(0,1-(ac.currentTime-(n.hit||-9))*5):0;x.beginPath();x.arc(p+n.x*L,b,2.6+hh*3,0,7);x.fill();
  if(dg&&dg.n===n){x.beginPath();x.arc(p+n.x*L,b,8,0,7);x.lineWidth=.8;x.stroke()}}
 if(!t.nodes.length){x.beginPath();x.arc(p+L*.5,b,2.4,0,7);x.stroke()}
 if(playing&&ac){const ph=Math.max(0,((ac.currentTime-t0)/bar())%1);x.globalAlpha=.4;x.beginPath();x.moveTo(p+ph*L,b-a);x.lineTo(p+ph*L,b+6);x.lineWidth=1;x.stroke()}
 const s=t.dr?`${t.nodes.length} \u00b7 ${Math.round(t.hz*mul(t))}Hz`:`${WV[t.wv].slice(0,3)} \u00b7 ${t.hz}Hz`;
 if(t.ls!==s){t.si.textContent=s;t.ls=s}t.lb.style.opacity=t.mute?.35:1}
/* ---------- controls ---------- */
function setBpm(v){v=Math.round(cl(v,60,200));if(v===S.bpm)return;
 if(playing&&ac){const ph=(ac.currentTime-t0)/bar();S.bpm=v;t0=ac.currentTime-ph*bar()}else S.bpm=v;
 $('#bpm').textContent=v;setDelay();save()}
let gb=null;const bw=$('#bw');
bw.onpointerdown=e=>{bw.setPointerCapture(e.pointerId);gb={y:e.clientY,b:S.bpm}};
bw.onpointermove=e=>{if(gb)setBpm(gb.b+(gb.y-e.clientY)/3)};bw.onpointerup=()=>gb=null;
let taps=[];$('#tap').onclick=()=>{const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);taps=taps.slice(-5);
 if(taps.length>1)setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))};
$('#play').onclick=()=>{initA();if(!playing){t0=ac.currentTime+.06;cur=t0;playing=true}else playing=false;$('#play').classList.toggle('on',playing)};
$('#pl').onclick=()=>setPat(pat-1);$('#pr').onclick=()=>setPat(pat+1);
$('#rnd').onclick=()=>{const D=[[3,5],[1,3],[0,4],[4,9],[1,3],[0,4],[1,2]];
 TR.forEach((t,k)=>{const base=(k==0||k==4),c=(D[k][0]+Math.random()*(D[k][1]-D[k][0])|0)+(base?1:0),st=new Set(base?[0]:[]);
  while(st.size<c)st.add(Math.random()*16|0);t.nodes=[...st].map(s=>({x:s/16,v:.45+Math.random()*.5}))});save()};
const pop=$('#pop');$('#menu').onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden};
document.addEventListener('click',()=>pop.hidden=true);
$('#clr').onclick=()=>{TR.forEach(t=>t.nodes=[]);save()};
/* ---------- visualizer ---------- */
const vz=$('#viz'),vc=$('#cv'),SC=['ROOM','CELL','LAND'],fd=new Uint8Array(512);
let sc=0,VW=0,VH=0,vd=1,B=0,M=0,Hh=0,tt=0;
function vr(){vd=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;vc.width=VW*vd;vc.height=VH*vd}
function openV(){pop.hidden=true;vz.hidden=false;vr()}
const closeV=()=>vz.hidden=true;
$('#vis').onclick=openV;$('#vz2').onclick=openV;$('#x').onclick=e=>{e.stopPropagation();closeV()};
let sx=0;vz.onpointerdown=e=>sx=e.clientX;
vz.onpointerup=e=>{if(e.target.id==='x')return;const d=e.clientX-sx;sc=(sc+(d>40?2:1))%3;$('#sn').textContent=SC[sc]};
window.onBack=()=>{if(!vz.hidden){closeV();return true}if(!pop.hidden){pop.hidden=true;return true}return false};
function ana(){an?an.getByteFrequencyData(fd):fd.fill(0);const av=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=fd[i];return s/(b-a)/255};
 B+=(av(1,5)-B)*.35;M+=(av(6,40)-M)*.3;Hh+=(av(60,200)-Hh)*.3}
const ln=(x,a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()};
const hist=[];let hc=0;
function room(x,W,H){
 if(hc++%3==0){const r=[];for(let i=0;i<64;i++)r.push(fd[Math.floor(Math.pow(i/64,1.6)*180)+1]/255*(.4+i/90)+Math.random()*.02);hist.unshift(r);if(hist.length>16)hist.pop()}
 const L=W*.27,R=W*.73,T=H*.1,Bt=H*.72,hz=H*.5;x.strokeStyle=INK;x.lineWidth=1;
 x.globalAlpha=.8;ln(x,L,T,L,Bt);ln(x,R,T,R,Bt);ln(x,0,H,L,Bt);ln(x,W,H,R,Bt);ln(x,L,Bt,R,Bt);ln(x,L,hz,R,hz);
 x.beginPath();x.arc(W/2,H*.47,1.5,0,7);x.fillStyle=INK;x.fill();
 for(let r=hist.length-1;r>=0;r--){const y0=hz+(Bt-hz)*(1-r/15),h=hist[r];x.beginPath();x.moveTo(L,y0);
  for(let i=0;i<64;i++)x.lineTo(L+(R-L)*i/63,y0-h[i]*(Bt-hz)*.85);x.lineTo(R,y0);x.fillStyle=BG;x.fill();x.globalAlpha=.6;x.stroke()}
 x.globalAlpha=1}
const sd=Array.from({length:44},()=>({x:Math.random()*240,y:Math.random()*135,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));
const cc=document.createElement('canvas');cc.width=240;cc.height=135;const cx=cc.getContext('2d'),im=cx.createImageData(240,135);
function cell(x,W,H){
 const k=1+B*5+M*2;sd.forEach(s=>{s.x+=s.vx*k;s.y+=s.vy*k;if(s.x<0||s.x>240)s.vx*=-1;if(s.y<0||s.y>135)s.vy*=-1});
 const d=im.data,th=.8+B*1.4;let i=0;
