name: build-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Version from tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            T="${GITHUB_REF_NAME#v}"
            IFS=. read -r A B C <<< "$T"
            echo "vn=$T" >> "$GITHUB_OUTPUT"
            echo "vc=$(( 10#${A:-0} * 10000 + 10#${B:-0} * 100 + 10#${C:-0} ))" >> "$GITHUB_OUTPUT"
          else
            echo "vn=0.0.$GITHUB_RUN_NUMBER-dev" >> "$GITHUB_OUTPUT"
            echo "vc=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell the app where to look for updates
        run: echo "$GITHUB_REPOSITORY" > app/src/main/assets/repo.txt

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/spherical-release.p12"
            echo "KS_PATH=$RUNNER_TEMP/spherical-release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "KEYSTORE_B64 secret is missing: run 'bash publish.sh' from Termux (it uploads it)."; exit 1
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "version name=${{ steps.v.outputs.vn }} code=${{ steps.v.outputs.vc }} signed=${KS_PATH:+yes}"
          gradle assembleRelease --no-daemon --stacktrace -Pvc="${{ steps.v.outputs.vc }}" -Pvn="${{ steps.v.outputs.vn }}"

      - run: cp app/build/outputs/apk/release/app-release.apk Spherical.apk
      - uses: actions/upload-artifact@v4
        with: { name: Spherical, path: Spherical.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Spherical.apk }
